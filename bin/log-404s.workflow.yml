name: Log 404 hits

# Polls the private ntfy.sh topic that js/notify-404.js pings and appends any new
# 404 hits to a durable log kept on a dedicated data branch (default: sol-404-log).
#
# Why a separate branch: production (solkpg.com) is the Vercel deploy of `master`,
# so the log must NOT live on `master` or it would be publicly downloadable and
# would redeploy the site on every write. The data branch is an orphan branch that
# holds only logs/404-hits.jsonl — nothing to serve, nothing to build.
#
# Scheduled workflows only run from the repo's DEFAULT branch, so this has to be
# merged into `master` before the cron fires. Use "Run workflow" (workflow_dispatch)
# from the Actions tab to test it once merged.

on:
  schedule:
    - cron: "17 * * * *" # hourly at :17 (ntfy caches ~12h, so hourly has wide margin)
  workflow_dispatch: {}

permissions:
  contents: write # push the updated log to the data branch

concurrency:
  group: log-404s
  cancel-in-progress: false

env:
  LOG_BRANCH: sol-404-log

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (for bin/collect-404s.mjs)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect new 404 hits and publish to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Fetch the data branch into ./data, creating it as an orphan on first run.
          if git ls-remote --exit-code --heads "$REPO_URL" "$LOG_BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$LOG_BRANCH" "$REPO_URL" data
          else
            echo "Data branch '$LOG_BRANCH' does not exist yet; creating it."
            git clone --depth 1 "$REPO_URL" data
            git -C data checkout --orphan "$LOG_BRANCH"
            git -C data rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p data/logs
          touch data/logs/404-hits.jsonl

          node bin/collect-404s.mjs data/logs/404-hits.jsonl

          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/404-hits.jsonl
          if git diff --cached --quiet; then
            echo "No new 404 hits."
            exit 0
          fi
          git commit -m "Log 404 hits ($(date -u +%FT%TZ))"
          git push origin "$LOG_BRANCH"
